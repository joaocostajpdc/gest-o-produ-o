<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minho Ferragens · Gestão de Produção</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Ecrã de arranque — desaparece quando o React monta -->
      <div id="splash" style="
        position:fixed;inset:0;
        background:#0f1322;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        gap:20px;font-family:Inter,sans-serif;
      ">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="white"/>
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
            font-size="22" font-weight="800" fill="#1d4ed8">MF</text>
        </svg>
        <div style="color:#8e96b8;font-size:14px;letter-spacing:.05em;">A carregar…</div>
        <div style="width:160px;height:3px;background:#1e2540;border-radius:99px;overflow:hidden;">
          <div style="
            height:100%;width:40%;background:#3b6ef0;border-radius:99px;
            animation:sl 1.4s ease-in-out infinite;
          "></div>
        </div>
        <style>
          @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove o splash assim que o React montar (qualquer mudança no root)
      const obs = new MutationObserver(() => {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.style.opacity = '0';
          splash.style.transition = 'opacity .3s';
          setTimeout(() => splash.remove(), 300);
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true, subtree: false });

      // Fallback: se o React não carregou em 10s, mostra diagnóstico
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) {
          // React ainda não carregou — mostrar erro visível
          splash.innerHTML = '<div style="color:#f87171;font-size:16px;padding:32px;text-align:center;"><div style="font-size:24px;margin-bottom:16px;">⚠️ A aplicação não carregou</div><div style="color:#8e96b8;margin-bottom:16px;">Erro ao iniciar o React. Abra a consola do browser (F12 → Console) para ver o erro.</div><button onclick="window.location.reload()" style="padding:10px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;">Tentar novamente</button></div>';
          splash.style.position = 'fixed';
          splash.style.inset = '0';
          splash.style.background = '#0f1322';
          splash.style.display = 'flex';
          splash.style.alignItems = 'center';
          splash.style.justifyContent = 'center';
        }
      }, 10000);
    </script>
  </body>
</html>
