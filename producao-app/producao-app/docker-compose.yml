version: "3.8"

# Ambiente de desenvolvimento local: apenas a base de dados PostgreSQL.
# Corre `docker compose up -d` e depois `npm run prisma:migrate` no backend.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: producao
      POSTGRES_PASSWORD: producao
      POSTGRES_DB: producao_app
    ports:
      - "5432:5432"
    volumes:
      - producao_db_data:/var/lib/postgresql/data

volumes:
  producao_db_data:
